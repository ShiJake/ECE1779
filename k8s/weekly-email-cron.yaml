apiVersion: batch/v1
kind: CronJob
metadata:
  name: sweatsync-weekly-email
  namespace: sweatsync
spec:
  schedule:   "*/1 * * * *" # every 1 minute for testing
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: weekly-email-job
              image: ghcr.io/shijake/sweatsync-backend:latest
              imagePullPolicy: Always
              command: ["node", "src/sendWeeklyEmails.js"]
              env:
                # reuse the same DB config as your backend
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: db-secret         
                      key: DATABASE_URL

                # SendGrid API key (you need to create this secret)
                - name: SENDGRID_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sendgrid-secret  
                      key: SENDGRID_API_KEY

