name: Apply Cloud Secrets
on:
  workflow_dispatch: {}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.6'

      - name: Write kubeconfig
        run: echo "$KUBECONFIG_B64" | base64 -d > $HOME/.kube/config
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}

      - name: Create/Update sendgrid secret
        run: |
          kubectl -n sweatsync create secret generic sendgrid-secret \
            --from-literal=SENDGRID_API_KEY="${{ secrets.SENDGRID_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -