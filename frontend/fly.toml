# fly.toml app configuration file generated for sweatsync-frontend on 2025-11-23T17:44:49-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sweatsync-frontend'
primary_region = 'yyz'

[build]
  dockerfile = "Dockerfile"
  builtin = "node"
  install_dev_dependencies = true
  build_context = "."

[env]
  NODE_ENV = "production"
  VITE_BACKEND_URL = "https://sweatsync-backend.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 400


[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    handlers = ["http"]
    port = 8080

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
